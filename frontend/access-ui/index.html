<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLACKJACK_77</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      font-family: 'Press Start 2P', monospace;
    }

    /* Корпус автомата */
    .machine {
      width: 100%;
      max-width: 420px;
      background: #111;
      border: 3px solid #2a2a2a;
      border-radius: 18px;
      padding: 14px;
      box-shadow: 0 0 40px rgba(0, 255, 60, 0.06);
    }

    /* CRT-экран */
    .crt {
      position: relative;
      background: radial-gradient(ellipse at center, #0d3312 0%, #071f0b 70%, #041206 100%);
      border: 4px solid #3a3a3a;
      border-radius: 12px;
      padding: 16px 12px;
      min-height: 430px;
      overflow: hidden;
      color: #39ff5a;
      text-shadow: 0 0 6px rgba(57, 255, 90, 0.7);
    }
    /* Сканлайны */
    .crt::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25) 0px,
        rgba(0, 0, 0, 0.25) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
    }
    /* Мерцание */
    .crt::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(57, 255, 90, 0.02);
      animation: flicker 0.12s infinite;
      pointer-events: none;
    }
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }

    .screen-inner { position: relative; z-index: 1; }

    /* Лицо автомата (ASCII-пиксель) */
    .face {
      text-align: center;
      font-size: 11px;
      line-height: 1.1;
      white-space: pre;
      margin-bottom: 10px;
      animation: faceblink 4s infinite;
    }
    @keyframes faceblink {
      0%, 92%, 100% { opacity: 1; }
      94%, 96% { opacity: 0.3; }
    }

    /* Табло DEALER / COUNT */
    .panel-row {
      display: flex;
      gap: 6px;
      font-size: 9px;
      margin-bottom: 8px;
    }
    .panel-box {
      border: 2px solid #39ff5a;
      padding: 6px 8px;
      flex: 1;
      background: rgba(57, 255, 90, 0.06);
    }
    .panel-box span { opacity: 0.9; }

    /* Карты */
    .cards-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 10px 0;
      min-height: 54px;
    }
    .card {
      width: 40px;
      height: 54px;
      border: 2px solid #39ff5a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: rgba(57, 255, 90, 0.08);
      animation: deal 0.25s ease-out;
    }
    .card.back { color: #39ff5a; }
    @keyframes deal {
      from { transform: translateY(-14px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .status-line {
      font-size: 9px;
      line-height: 1.7;
      min-height: 40px;
    }
    .win { color: #b6ffcb; }
    .lose { color: #ff5a5a; text-shadow: 0 0 6px rgba(255, 90, 90, 0.7); }

    /* Кнопки */
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      position: relative;
      z-index: 1;
    }
    button {
      flex: 1;
      padding: 12px 4px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      background: #0d3312;
      color: #39ff5a;
      border: 2px solid #39ff5a;
      cursor: pointer;
      text-shadow: 0 0 5px rgba(57, 255, 90, 0.7);
      box-shadow: 0 0 10px rgba(57, 255, 90, 0.2);
      transition: all 0.15s;
    }
    button:active { transform: scale(0.96); background: rgba(57, 255, 90, 0.2); }
    button:disabled { opacity: 0.3; cursor: default; }
    .bet-row { display: flex; gap: 8px; margin-top: 8px; position: relative; z-index: 1; }

    /* Нижняя панель корпуса */
    .base {
      margin-top: 12px;
      background: linear-gradient(180deg, #4a3826 0%, #332416 100%);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }
    .slot {
      background: #0a0a0a;
      border: 3px solid #666;
      border-radius: 4px;
      padding: 10px;
      color: #888;
      font-size: 8px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="machine">
    <div class="crt">
      <div class="screen-inner">
        <div class="face">┌○┐&nbsp;&nbsp;&nbsp;┌○┐<br>&nbsp;&nbsp;█&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;█&nbsp;<br>&nbsp;└─┐&nbsp;&nbsp;┌─┘</div>

        <div class="panel-row">
          <div class="panel-box">DEALER: <span id="dealer-sum">?</span></div>
          <div class="panel-box">COUNT: <span id="player-sum">0</span></div>
        </div>

        <div class="cards-row" id="dealer-cards"></div>
        <div class="cards-row" id="player-cards"></div>

        <div class="status-line" id="status">&gt; INSERT COINS...<br>&gt; РАЗДАЙ КАРТЫ</div>
      </div>
    </div>

    <div class="controls">
      <button id="deal">РАЗДАТЬ</button>
      <button id="hit" disabled>ЕЩЁ</button>
      <button id="stand" disabled>СТОП</button>
    </div>

    <div class="bet-row">
      <button id="bet10">+10</button>
      <button id="bet50">+50</button>
      <button id="bet100">+100</button>
    </div>

    <div class="base">
      <div class="slot">CHIP: <span id="balance">100</span> | BET: <span id="bet">10</span></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
