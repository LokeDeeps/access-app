<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
      color: #eee;
      background: #0d0b16;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    /* Переливающиеся пятна фона */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      z-index: -1;
      pointer-events: none;
    }
    .blob-a {
      width: 70vmax; height: 70vmax;
      background: radial-gradient(circle, #6c5ce7 0%, transparent 65%);
      top: -25vmax; left: -20vmax;
      animation: driftA 14s ease-in-out infinite alternate;
    }
    .blob-b {
      width: 60vmax; height: 60vmax;
      background: radial-gradient(circle, #b0399e 0%, transparent 65%);
      bottom: -25vmax; right: -18vmax;
      animation: driftB 18s ease-in-out infinite alternate;
    }
    .blob-c {
      width: 50vmax; height: 50vmax;
      background: radial-gradient(circle, #341c5c 0%, transparent 70%);
      bottom: -10vmax; left: 20vmax;
      animation: driftC 22s ease-in-out infinite alternate;
    }
    @keyframes driftA {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30vmax, 22vmax) scale(1.25); }
    }
    @keyframes driftB {
      from { transform: translate(0, 0) scale(1.2); }
      to   { transform: translate(-25vmax, -18vmax) scale(0.9); }
    }
    @keyframes driftC {
      from { transform: translate(0, 0) scale(0.9); }
      to   { transform: translate(18vmax, -20vmax) scale(1.3); }
    }

    nav {
      display: flex;
      gap: 10px;
      padding: 16px;
      width: 100%;
      max-width: 420px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      background: rgba(20, 16, 38, 0.6);
      color: #aaa;
      border: 2px solid #4a4a6a;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .tab.active {
      color: #fff;
      border-color: #a55eea;
      background: rgba(108, 92, 231, 0.3);
      box-shadow: 0 0 14px rgba(165, 94, 234, 0.5);
    }
    .panel { display: none; width: 100%; max-width: 420px; padding: 0 16px 24px; }
    .panel.active { display: block; }
    .card {
      text-align: center;
      padding: 24px;
      border-radius: 16px;
      background: rgba(36, 28, 62, 0.75);
      border: 2px solid #4a4a6a;
      margin-top: 12px;
    }
    input {
      width: 100%; padding: 12px; font-size: 20px; text-align: center;
      border: 2px solid #4a4a6a; border-radius: 8px; background: rgba(13, 11, 22, 0.8);
      color: #eee; margin: 12px 0;
    }
    input:focus { outline: none; border-color: #a55eea; }
    button.act {
      width: 100%; padding: 12px; font-size: 18px;
      border: 2px solid #a55eea; border-radius: 8px;
      background: #6c5ce7; color: #fff; cursor: pointer;
    }
    #msg { min-height: 20px; color: #ff7675; }
    #tree {
      background: rgba(13, 11, 22, 0.7);
      border: 2px solid #4a4a6a;
      border-radius: 16px;
      padding: 14px 4px;
      margin-top: 12px;
      min-height: 430px;
      font-size: 16px;
      line-height: 1.15;
      color: #7bed9f;
      white-space: pre;
      overflow: hidden;
      text-align: center;
    }
    #grow { margin-top: 14px; }
  </style>
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>

  <nav>
    <button class="tab active" data-tab="main">Главная</button>
    <button class="tab" data-tab="fun">Приколюха 🌳</button>
  </nav>

  <section id="tab-main" class="panel active">
    <div class="card">
      <h1>Access</h1>
      <p>Введите PIN</p>
      <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" />
      <button id="go" class="act">Войти</button>
      <p id="msg"></p>
    </div>
  </section>

  <section id="tab-fun" class="panel">
    <pre id="tree"></pre>
    <button id="grow" class="act">Вырастить новое дерево</button>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
