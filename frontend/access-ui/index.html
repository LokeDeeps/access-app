<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: sans-serif;
      color: #eee;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 55%, #0f0f1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    nav {
      display: flex;
      gap: 10px;
      padding: 16px;
      width: 100%;
      max-width: 420px;
    }
    .tab {
      flex: 1;
      padding: 12px;
      font-size: 15px;
      background: transparent;
      color: #aaa;
      border: 2px solid #4a4a6a;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s;
    }
    .tab.active {
      color: #fff;
      border-color: #6c5ce7;
      background: rgba(108, 92, 231, 0.25);
      box-shadow: 0 0 12px rgba(108, 92, 231, 0.4);
    }
    .panel { display: none; width: 100%; max-width: 420px; padding: 0 16px 24px; }
    .panel.active { display: block; }
    .card {
      text-align: center;
      padding: 24px;
      border-radius: 16px;
      background: #24243e;
      border: 2px solid #4a4a6a;
      margin-top: 12px;
    }
    input {
      width: 100%; padding: 12px; font-size: 20px; text-align: center;
      border: 2px solid #4a4a6a; border-radius: 8px; background: #1a1a2e;
      color: #eee; margin: 12px 0;
    }
    input:focus { outline: none; border-color: #6c5ce7; }
    button.act {
      width: 100%; padding: 12px; font-size: 18px;
      border: 2px solid #6c5ce7; border-radius: 8px;
      background: #6c5ce7; color: #fff; cursor: pointer;
    }
    #msg { min-height: 20px; color: #ff7675; }
    #tree {
      background: #12121f;
      border: 2px solid #4a4a6a;
      border-radius: 16px;
      padding: 20px 10px;
      margin-top: 12px;
      min-height: 320px;
      font-size: 18px;
      line-height: 1.35;
      color: #7bed9f;
      white-space: pre;
      overflow: hidden;
      text-align: center;
    }
    #grow { margin-top: 14px; }
  </style>
</head>
<body>
  <nav>
    <button class="tab active" data-tab="main">Главная</button>
    <button class="tab" data-tab="fun">Приколюха 🌳</button>
  </nav>

  <section id="tab-main" class="panel active">
    <div class="card">
      <h1>Access</h1>
      <p>Введите PIN</p>
      <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" />
      <button id="go" class="act">Войти</button>
      <p id="msg"></p>
    </div>
  </section>

  <section id="tab-fun" class="panel">
    <pre id="tree"></pre>
    <button id="grow" class="act">Вырастить новое дерево</button>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
