<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #eee;
      background: #0d0b16;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* Анимированный фон */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.55;
      z-index: -1;
      pointer-events: none;
    }
    .blob-a {
      width: 70vmax; height: 70vmax;
      background: radial-gradient(circle, #6c5ce7 0%, transparent 65%);
      top: -25vmax; left: -20vmax;
      animation: driftA 14s ease-in-out infinite alternate;
    }
    .blob-b {
      width: 60vmax; height: 60vmax;
      background: radial-gradient(circle, #b0399e 0%, transparent 65%);
      bottom: -25vmax; right: -18vmax;
      animation: driftB 18s ease-in-out infinite alternate;
    }
    .blob-c {
      width: 50vmax; height: 50vmax;
      background: radial-gradient(circle, #341c5c 0%, transparent 70%);
      bottom: -10vmax; left: 20vmax;
      animation: driftC 22s ease-in-out infinite alternate;
    }
    @keyframes driftA { from { transform: translate(0, 0) scale(1); } to { transform: translate(30vmax, 22vmax) scale(1.25); } }
    @keyframes driftB { from { transform: translate(0, 0) scale(1.2); } to { transform: translate(-25vmax, -18vmax) scale(0.9); } }
    @keyframes driftC { from { transform: translate(0, 0) scale(0.9); } to { transform: translate(18vmax, -20vmax) scale(1.3); } }

    /* Шапка приложения */
    header {
      padding: 20px 16px 4px;
      width: 100%;
      max-width: 420px;
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      color: #fff;
    }

    /* Контент */
    .panel {
      width: 100%;
      max-width: 420px;
      padding: 8px 16px 24px;
    }

    /* Карточка */
    .card {
      text-align: left;
      padding: 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }
    .card h3 {
      margin-top: 0;
      color: #fff;
      font-size: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
    }

    /* Поля ввода */
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #a55eea; box-shadow: 0 0 12px rgba(165, 94, 234, 0.3); }

    /* Кнопки */
    button.act {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #6c5ce7;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button.act:active { transform: scale(0.98); }
    button.act:hover { box-shadow: 0 6px 18px rgba(108, 92, 231, 0.4); }

    /* Таблица */
    .table-container {
      overflow-x: auto;
      margin-top: 15px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      color: #ddd;
      font-size: 14px;
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    th {
      background: rgba(255, 255, 255, 0.05);
      color: #aaa;
      font-weight: 600;
    }
    tr:hover { background: rgba(255, 255, 255, 0.03); }
  </style>
</head>
<body>
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>

  <header>
    <h1>Access</h1>
  </header>

  <section class="panel">
    <div class="card">
      <h3>Данные</h3>
      <div class="table-container">
        <table id="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Статус</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
      <div style="margin-top: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <input type="text" id="row-name" placeholder="Название" />
        <input type="text" id="row-status" placeholder="Статус" />
      </div>
      <button id="add-row" class="act">Добавить строку</button>
    </div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
