<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access</title>
  <style>
    :root {
      --bg-dark: #0b0b12;
      --bg-card: rgba(255, 255, 255, 0.04);
      --bg-input: rgba(20, 20, 30, 0.4);
      --primary: #a55eea;
      --primary-grad: linear-gradient(135deg, #a55eea 0%, #c77dff 100%);
      --text-main: #ffffff;
      --text-sec: #a0a0b0;
      --border: rgba(255, 255, 255, 0.08);
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      padding-bottom: 20px;
    }

    /* Декоративные пятна (как на картинке) */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      z-index: -1;
      pointer-events: none;
    }
    .blob-1 { width: 60vmax; height: 60vmax; background: #a55eea; top: -30vmax; left: -20vmax; animation: drift 16s ease-in-out infinite alternate; }
    .blob-2 { width: 50vmax; height: 50vmax; background: #c77dff; bottom: -25vmax; right: -15vmax; animation: drift 20s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(25vmax, 20vmax) scale(1.15); } }

    header {
      width: 100%;
      max-width: 420px;
      padding: 0 16px 16px;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      background: var(--primary-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }
    .subtitle {
      color: var(--text-sec);
      font-size: 14px;
      margin-top: 4px;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      padding: 0 16px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-top: 16px;
      box-shadow: var(--shadow);
    }
    .card h3 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: var(--text-main);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    /* Поля ввода */
    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text-main);
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--primary); }

    /* Кнопки */
    button.act {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary-grad);
      color: #fff;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(165, 94, 234, 0.3);
      transition: transform 0.1s, box-shadow 0.2s;
    }
    button.act:active { transform: scale(0.98); }

    /* Таблица */
    .table-container {
      overflow-x: auto;
      margin-top: 12px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      color: var(--text-main);
      font-size: 14px;
    }
    th, td {
      padding: 12px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    th {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-sec);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: rgba(255, 255, 255, 0.03); }

    .action-btn {
      background: #ff7675;
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-btn:active { transform: scale(0.95); }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <header>
    <h1>Access</h1>
    <div class="subtitle">Управление данными</div>
  </header>

  <section class="panel">
    <div class="card">
      <h3>Данные</h3>
      <div class="table-container">
        <table id="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Название</th>
              <th>Статус</th>
              <th>Действие</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>

      <div class="input-row">
        <input type="text" id="row-name" placeholder="Название" />
        <input type="text" id="row-status" placeholder="Статус" />
      </div>
      <button id="add-row" class="act">Добавить строку</button>
    </div>
  </section>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
