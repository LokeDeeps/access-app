<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Access App</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #121212; color: #fff;
        display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
      .card { background: #1e1e1e; padding: 2rem; border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.4); text-align: center;
        width: 90%; max-width: 340px; border: 1px solid #333; }
      input { width: 100%; padding: 14px; margin: 12px 0; border: 1px solid #444;
        border-radius: 8px; background: #2a2a2a; color: #fff;
        box-sizing: border-box; font-size: 16px; }
      button { width: 100%; padding: 14px; border: none; border-radius: 8px;
        cursor: pointer; font-weight: bold; font-size: 16px; color: white;
        background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%); }
      .error { color: #ff5252; margin-top: 10px; font-size: 14px; }
      .success { color: #4ade80; margin-top: 10px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2 id="title">Вход в систему</h2>
      <p id="subtitle">Введите PIN-код</p>
      <input type="password" id="pin" placeholder="••••" maxlength="10" />
      <button onclick="handleLogin()">Войти</button>
      <div id="message"></div>
    </div>
    <script>
      async function handleLogin() {
        const pin = document.getElementById('pin').value;
        const msg = document.getElementById('message');
        const title = document.getElementById('title');
        const sub = document.getElementById('subtitle');
        if (!pin) { msg.innerHTML = '<span class="error">Введите PIN!</span>'; return; }
        try {
          const result = await window.__TAURI__.invoke('check_pin', { pin });
          if (result === 'success') {
            msg.innerHTML = '<span class="success">✅ Доступ разрешён!</span>';
            title.innerText = 'Успех'; sub.innerText = '';
          } else if (result === 'wrong') {
            msg.innerHTML = '<span class="error">❌ Неверный PIN. Попробуйте снова.</span>';
            document.getElementById('pin').value = '';
          } else if (result === 'short') {
            msg.innerHTML = '<span class="error">❌ PIN должен быть минимум 4 символа.</span>';
          } else if (result === 'first_time') {
            msg.innerHTML = '<span class="success">✅ PIN установлен! Теперь войдите снова.</span>';
            document.getElementById('pin').value = '';
            sub.innerText = 'Придумайте PIN для первого входа';
          }
        } catch (err) {
          msg.innerHTML = '<span class="error">Ошибка: ' + err + '</span>';
        }
      }
    </script>
  </body>
</html>
